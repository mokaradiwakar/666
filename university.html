<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Idea2Impact — UNIVERSITY</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Segoe UI,Arial,sans-serif}body{background:#f6f7fb;color:#171827}.top{height:70px;background:#fff;border-bottom:1px solid #e5e6ee;display:flex;align-items:center;justify-content:space-between;padding:0 6%}.logo{font-size:19px;font-weight:900;color:#5b5ce2}.logout{border:1px solid #e1e3eb;background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:700}.wrap{max-width:1100px;margin:45px auto;padding:0 22px}.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:23px;padding:34px;margin-bottom:20px}.hero h1{font-size:30px;margin-bottom:8px}.hero p{font-size:12px;opacity:.85}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #e5e6ee;border-radius:16px;padding:22px;min-height:130px}.card h3{font-size:14px;margin-bottom:8px}.card p{font-size:11px;color:#77798b;line-height:1.6}.badge{display:inline-block;margin-top:10px;padding:6px 9px;border-radius:999px;background:#eef0ff;color:#4f46e5;font-size:9px;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="logo">Idea2Impact</div><button id="logout" class="logout">Sign out</button></header><main class="wrap"><section class="hero"><h1 id="welcome">Welcome</h1><p id="status">Checking your profile...</p></section><section class="grid"><div class="card"><h3>🌍 Discover Problems</h3><p>Explore real societal challenges and opportunities to contribute.</p></div><div class="card"><h3>🤝 Collaborate</h3><p>Connect with people and organizations to solve challenges.</p></div><div class="card"><h3>🚀 Track Impact</h3><p>Follow projects from idea and prototype to implementation.</p></div></section></main><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";const firebaseConfig={apiKey:"AIzaSyCHkO8BsebKfoV16DB69-d-RwI6PVpO0dvI",authDomain:"studio-1076302594-e57ec.firebaseapp.com",projectId:"studio-1076302594-e57ec",storageBucket:"studio-1076302594-e57ec.firebasestorage.app",messagingSenderId:"345390719963",appId:"1:345390719963:web:8afbad8ea1f739694afdfe"};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),expected="UNIVERSITY";onAuthStateChanged(auth,async u=>{if(!u)return location.href="index.html";const s=await getDoc(doc(db,"users",u.uid));if(!s.exists()||s.data().role!==expected)return location.href="index.html";const d=s.data();document.getElementById("welcome").textContent="Welcome, "+(d.name||u.displayName||"Member");document.getElementById("status").textContent="Account: "+d.role+" • Status: "+(d.verificationStatus||"UNKNOWN")});document.getElementById("logout").onclick=async()=>{await signOut(auth);location.href="index.html"}</script></body></html>
